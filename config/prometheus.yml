global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/workstream/prometheus-alerts.yml

# Each role exposes an identical, loopback-only metrics endpoint. The
# `service` label is added here from the static target name; it is never taken
# from a request. Alert expressions therefore distinguish the five stall
# categories by metric name while the dashboard can split by service.
scrape_configs:
  - job_name: workstream
    static_configs:
      - targets: ["sequencer:9090"]
        labels: {service: sequencer}
      - targets: ["prover:9090"]
        labels: {service: prover}
      - targets: ["node:9090"]
        labels: {service: node}
