# WorkStream Prover example configuration
# Load with: workstream-prover --config config/prover.example.toml
#
# Loading order (later wins):
#   1. Built-in defaults
#   2. This file
#   3. Environment overrides (e.g. WORKSTREAM_PROVER_ZKVM=risc0)
#   4. CLI flags (e.g. --zkvm risc0)

# Follow the shared deployment profile; an explicit backend is an assertion.
zkvm = "auto"

# Optional path to a file listing block numbers to prove
# blocks = "blocks.txt"

# Optional expected genesis guest image ID (hex)

# Log level: trace, debug, info, warn, error (default: info)
log_level = "info"
