[package]
name = "workstream-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query", "form"] }
getrandom = "0.3"
jsonwebtoken = { version = "12.0", default-features = false, features = ["aws_lc_rs"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rusqlite = { version = "0.43", features = ["bundled"] }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = { workspace = true }
workstream-core = { path = "../workstream-core" }
workstream-crypto = { path = "../workstream-crypto" }
workstream-tx = { path = "../workstream-tx" }
workstream-stf = { path = "../workstream-stf" }

[dev-dependencies]
tempfile = "3"
ed25519-dalek = { workspace = true }
tower = { version = "0.5", features = ["util"] }
