name: workstream-localnet

x-service: &service
  image: ${WORKSTREAM_IMAGE:-workstream:compose-gate}
  pull_policy: never
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &env
    WORKSTREAM_PROFILE: dev
    WORKSTREAM_RUNTIME_DIR: /ipc/runtime
    WORKSTREAM_IDENTITY_DIR: /identity
  healthcheck:
    test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/readyz', timeout=2).read()"]
    interval: 2s
    timeout: 3s
    retries: 12

services:
  bootstrap:
    image: ${WORKSTREAM_IMAGE:-workstream:compose-gate}
    build: .
    user: '0:0'
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    volumes: [ipc:/ipc, node-id:/keys/node, writer-id:/keys/sequencer, worker-id:/keys/prover, writer-data:/data, db-secrets:/db-secrets]
    entrypoint: [/bin/bash, -euc]
    command:
      - |
        install -d -m 0700 -o 10001 -g 10001 /ipc/runtime
        install -d -m 0700 -o 10001 -g 10001 /data/journal
        for key in admin worker projection; do
          if [ ! -s /db-secrets/$$key ]; then openssl rand -hex 32 > /db-secrets/$$key; fi
          chmod 0444 /db-secrets/$$key
        done
        cp /db-secrets/worker /keys/prover/pg.password
        chmod 0600 /keys/prover/pg.password
        cp /db-secrets/projection /keys/node/pg.password
        chmod 0600 /keys/node/pg.password
        bash /app/dev-service-identities.sh /tmp/identities
        for role in node sequencer prover; do
          cp /tmp/identities/$$role/*.{der,pem} /keys/$$role/
          chown -R 10001:10001 /keys/$$role
          chmod 0700 /keys/$$role
        done
  jobdb:
    image: postgres:16-alpine
    network_mode: none
    depends_on: {bootstrap: {condition: service_completed_successfully}}
    command: [postgres, -c, listen_addresses=]
    environment:
      POSTGRES_DB: proofjobs
      POSTGRES_PASSWORD_FILE: /db-secrets/admin
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256
    volumes:
      - jobs-data:/var/lib/postgresql/data
      - jobs-socket:/var/run/postgresql
      - db-secrets:/db-secrets:ro
      - ./scripts/init-proof-jobs.sh:/docker-entrypoint-initdb.d/10-worker.sh:ro
      - ./scripts/init-projections.sh:/docker-entrypoint-initdb.d/11-projections.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD=$$(cat /db-secrets/worker) psql -U worker -d proofjobs -Atqc "SELECT 1"']
      interval: 2s
      timeout: 3s
      retries: 15
  prover:
    <<: *service
    depends_on: {jobdb: {condition: service_healthy}}
    command: [workstream-prover, --metrics-port, '9090']
    environment:
      <<: *env
      WORKSTREAM_JOBS_SOCKET: /var/run/postgresql
      WORKSTREAM_JOBS_PORT: '5432'
      WORKSTREAM_JOBS_PASSWORD_FILE: /identity/pg.password
    volumes: [ipc:/ipc, worker-id:/identity:ro, jobs-socket:/var/run/postgresql:ro]
  sequencer:
    <<: *service
    depends_on: {prover: {condition: service_healthy}}
    command: [workstream-sequencer, --metrics-port, '9090']
    environment:
      <<: *env
      WORKSTREAM_WRITER_DATA: /data/journal
    volumes: [ipc:/ipc, writer-id:/identity:ro, writer-data:/data]
  node:
    <<: *service
    depends_on: {sequencer: {condition: service_healthy}, jobdb: {condition: service_healthy}}
    command: [workstream-node, --metrics-port, '9090']
    environment:
      <<: *env
      WORKSTREAM_NODE_RPC_PORT: '8545'
      WORKSTREAM_PROJECTIONS_SOCKET: /var/run/postgresql
      WORKSTREAM_PROJECTIONS_PORT: '5432'
      WORKSTREAM_PROJECTIONS_PASSWORD_FILE: /identity/pg.password
    volumes: [ipc:/ipc, node-id:/identity:ro, jobs-socket:/var/run/postgresql:ro]

volumes:
  jobs-data:
  jobs-socket:
  db-secrets:
  writer-data:
  ipc:
  node-id:
  writer-id:
  worker-id:
