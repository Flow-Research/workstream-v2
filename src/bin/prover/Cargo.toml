[package]
name = "workstream-prover"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "prover"
path = "main.rs"

[dependencies]
workstream-ops = { path = "../../../crates/workstream-ops" }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["client", "disable-dev-mode"] }
risc0-binfmt = "=3.0.6"
risc0-zkos-v1compat = "=2.2.3"
# Receipt control IDs and seal formats must match the r0vm 3.1.0 binary.
risc0-circuit-rv32im = { version = "=4.1.0", default-features = false }
risc0-circuit-recursion = { version = "=4.1.0", default-features = false }
risc0-circuit-keccak = { version = "=4.1.0", default-features = false }
risc0-zkp = { version = "=3.0.6", default-features = false }
risc0-groth16 = { version = "=3.0.6", default-features = false }
bincode = "1.3"
tempfile = "3"
postcard.workspace = true
workstream-core = { path = "../../../crates/workstream-core" }
workstream-stf = { path = "../../../crates/workstream-stf" }
workstream-state = { path = "../../../crates/workstream-state" }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

[target.'cfg(unix)'.dependencies]
tokio-postgres = "0.7"
