[package]
name = "workstream-sequencer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "sequencer"
path = "main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
workstream-ops = { path = "../../../crates/workstream-ops" }
workstream-core = { path = "../../../crates/workstream-core" }
workstream-state = { path = "../../../crates/workstream-state" }
workstream-stf = { path = "../../../crates/workstream-stf" }
workstream-prover = { path = "../prover" }
workstream-tx = { path = "../../../crates/workstream-tx" }
postcard = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = "0.22"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[dev-dependencies]
workstream-crypto = { path = "../../../crates/workstream-crypto" }
ed25519-dalek = { workspace = true }

[target.'cfg(unix)'.dependencies]
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
fs2 = "0.4"
